services:
  - type: web
    name: youtube-auto-uploader
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: DEFAULT_PRIVACY_STATUS
        value: public
      - key: MAX_VIDEO_SIZE_MB
        value: "450"
      - key: APP_SECRET_KEY
        generateValue: true
